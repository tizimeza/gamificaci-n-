<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071226">
  <title>Jugar | RoscoLab</title>
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/personajes.css">
  <script type="module" src="/assets/js/jugar.js"></script>
</head>
<body class="sitio">
  <header class="topbar">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
      <a href="/" class="display-font text-lg font-black">RoscoLab</a>
      <span id="materia-actual" class="materia-actual"></span>
      <div id="reloj-caja" class="hidden items-center gap-2 rounded-xl bg-amber-300/10 px-3 py-1.5">
        <i class="fa-regular fa-clock text-amber-300" aria-hidden="true"></i>
        <span id="reloj" class="display-font text-xl font-black tabular-nums" role="timer"></span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
    <section id="vista-codigo" class="glass mx-auto hidden max-w-md rounded-3xl p-5 sm:p-7">
      <h1 class="display-font text-2xl font-black">Entrá al rosco</h1>
      <p id="codigo-error" class="mt-2 hidden text-sm font-bold text-rose-300" role="alert"></p>
      <form action="/jugar" method="get" class="mt-4 flex gap-2">
        <label class="sr-only" for="codigo">Código del rosco</label>
        <input id="codigo" name="c" class="form-field min-h-11 w-full min-w-0 px-4 text-lg font-bold uppercase tracking-widest" maxlength="6" minlength="6" required autocomplete="off" placeholder="ABC234">
        <button class="primary-btn px-5 text-sm">Entrar</button>
      </form>
    </section>

    <section id="vista-inicio" class="mx-auto hidden max-w-2xl space-y-5">
      <div class="glass rounded-3xl p-5 sm:p-7">
        <div data-avatar-materia class="subject-welcome"></div>
        <p id="inicio-materia" class="eyebrow"></p>
        <h1 id="inicio-titulo" class="display-font mt-1 break-words text-2xl font-black sm:text-3xl"></h1>
        <p id="inicio-detalle" class="mt-2 text-sm text-slate-300"></p>
        <h2 class="mt-5 text-sm font-bold text-slate-300">Elegí tu seudónimo</h2>
        <div id="seudonimos" class="mt-2 grid gap-2 sm:grid-cols-3"></div>
        <button id="otros-seudonimos" class="mt-2 text-sm font-bold text-cyan-200 underline underline-offset-4">Ver otros</button>
        <p id="inicio-error" class="mt-3 hidden text-sm font-bold text-rose-300" role="alert"></p>
        <button id="empezar" class="primary-btn mt-5 w-full px-4 text-base" disabled>Empezar</button>
      </div>
      <div class="glass rounded-3xl p-5">
        <h2 class="display-font text-lg font-extrabold">Ranking</h2>
        <div id="inicio-ranking" class="mt-2"></div>
      </div>
    </section>

    <section id="vista-espera" class="mx-auto hidden max-w-2xl space-y-5">
      <div class="glass rounded-3xl p-5 text-center sm:p-8">
        <div data-avatar-materia class="subject-welcome"></div>
        <p class="eyebrow">Sala en vivo</p>
        <h1 id="espera-titulo" class="display-font mt-2 break-words text-2xl font-black sm:text-3xl"></h1>
        <p id="espera-yo" class="mt-3 text-lg font-bold text-amber-200"></p>
        <p id="espera-texto" class="mt-2 text-sm text-slate-300" role="status"></p>
        <p id="espera-cuenta" class="display-font mt-4 hidden text-7xl font-black text-cyan-200" aria-live="assertive"></p>
      </div>
      <div id="espera-tabla-caja" class="glass hidden rounded-3xl p-5">
        <h2 class="display-font text-lg font-extrabold">Marcador</h2>
        <div id="espera-tabla" class="mt-2"></div>
      </div>
    </section>

    <section id="vista-juego" class="hidden gap-5 lg:grid-cols-[minmax(320px,.9fr)_1.3fr]">
      <div class="glass rounded-3xl p-4"><div id="rosco" class="rosco-wrap" role="group" aria-label="Avance del rosco"></div></div>
      <div class="glass rounded-3xl p-5 sm:p-6">
        <p id="pista-letra" class="eyebrow"></p>
        <p id="definicion" class="mt-3 min-h-[6rem] text-xl font-semibold leading-relaxed sm:text-2xl" aria-live="polite"></p>
        <form id="respuesta-form" class="mt-4 space-y-2">
          <label class="sr-only" for="respuesta">Tu respuesta</label>
          <input id="respuesta" class="form-field block min-h-12 w-full px-4 text-lg" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" placeholder="Tu respuesta">
          <div class="grid grid-cols-2 gap-2">
            <button id="responder" class="primary-btn px-4 text-sm"><i class="fa-solid fa-check mr-2" aria-hidden="true"></i>Responder</button>
            <button id="pasar" type="button" class="secondary-btn px-4 text-sm"><i class="fa-solid fa-forward-step mr-2" aria-hidden="true"></i>Paso</button>
          </div>
        </form>
        <p id="progreso" class="mt-4 text-sm font-semibold text-slate-300"></p>
        <p id="vivo-posicion" class="mt-1 hidden text-sm font-bold text-amber-200" role="status"></p>
        <button id="abandonar" class="mt-2 text-sm font-semibold text-slate-400 underline underline-offset-4">Terminar ahora</button>
      </div>
    </section>

    <section id="vista-final" class="mx-auto hidden max-w-3xl space-y-5">
      <div class="glass rounded-3xl p-5 text-center sm:p-7">
        <div data-avatar-materia class="subject-result"></div>
        <p class="eyebrow">Tu resultado</p>
        <p id="final-puntaje" class="display-font mt-2 text-5xl font-black text-emerald-300"></p>
        <p id="final-detalle" class="mt-2 text-sm font-semibold text-slate-300"></p>
        <div class="mt-5 flex flex-wrap justify-center gap-2">
          <button id="otra-vez" class="primary-btn px-5 text-sm">Jugar de nuevo</button>
          <button id="compartir" class="secondary-btn px-5 text-sm"><i class="fa-solid fa-copy mr-2" aria-hidden="true"></i>Copiar enlace</button>
        </div>
      </div>
      <div class="glass rounded-3xl p-5">
        <div class="flex items-center justify-between gap-3">
          <h2 class="display-font text-lg font-extrabold">Ranking</h2>
          <span id="final-vivo" class="text-xs font-semibold text-slate-400">Se actualiza solo</span>
        </div>
        <div id="final-ranking" class="mt-2"></div>
      </div>
      <div class="glass rounded-3xl p-5">
        <h2 class="display-font text-lg font-extrabold">Repaso</h2>
        <ul id="correcciones" class="mt-3 space-y-2"></ul>
      </div>
    </section>
  </main>

  <div id="avisos" class="pointer-events-none fixed bottom-4 right-4 z-50 flex max-w-[calc(100%-2rem)] flex-col items-end gap-2" aria-live="polite"></div>
</body>
</html>
